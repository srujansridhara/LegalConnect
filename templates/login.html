<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - LegalConnect</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>

    <h1>LegalConnect</h1>

    <nav>
        <a href="/">Home</a>
        <a href="/register">Register</a>
    </nav>

</header>


<main>

    <section>

        <h2>Login</h2>

        <p>Login to access your LegalConnect account.</p>

        <form method="POST" action="/login">

            <label>Email</label><br>

            <input type="email"
                   name="email"
                   required>

            <br>

            <label>Password</label><br>

            <input type="password"
                   name="password"
                   required>

            <br><br>

            <button type="submit">
                Login
            </button>

        </form>

    </section>

</main>


<footer>

    <p>
        © 2026 LegalConnect | PRJ_320 Mini Project
    </p>

</footer>

</body>

</html>
