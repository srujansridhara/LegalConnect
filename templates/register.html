<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - LegalConnect</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>

    <h1>LegalConnect</h1>

    <nav>
        <a href="/">Home</a>
        <a href="/login">Login</a>
    </nav>

</header>


<main>

    <section>

        <h2>Create Your Account</h2>

        <p>Register as a Citizen or Legal Service Provider.</p>

        <form method="POST" action="/register">

            <label>Name</label><br>
            <input type="text"
                   name="name"
                   required>

            <br>

            <label>Email</label><br>
            <input type="email"
                   name="email"
                   required>

            <br>

            <label>Password</label><br>
            <input type="password"
                   name="password"
                   required>

            <br>

            <label>Account Type</label><br>

            <select name="role" required>

                <option value="citizen">
                    Citizen
                </option>

                <option value="provider">
                    Legal Service Provider
                </option>

            </select>

            <br><br>

            <button type="submit">
                Register
            </button>

        </form>

    </section>

</main>


<footer>

    <p>
        © 2026 LegalConnect | PRJ_320 Mini Project
    </p>

</footer>

</body>

</html>
